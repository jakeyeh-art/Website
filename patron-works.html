<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/Stamp.png?v=2" type="image/png">
<title>COMPLETED PATRON WORKS | JAKE YEN PO YEH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --black: #000; --ink: #fff; --muted: rgba(255,255,255,0.68); --panel: #202020; --line: rgba(255,255,255,0.2); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Jost', sans-serif; color: var(--ink); background: var(--black); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 48px; border-bottom: 1px solid var(--line); }
  .logo { font-family: 'Bungee', sans-serif; font-size: 1.35rem; line-height: 0.94; letter-spacing: 0.04em; text-transform: uppercase; max-width: 220px; white-space: normal; word-break: break-word; }
  .nav-links { display: flex; gap: 36px; list-style: none; }
  .nav-links a { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; padding-bottom: 4px; border-bottom: 1px solid transparent; }
  .nav-links a.active, .nav-links a:hover { border-bottom-color: var(--ink); }
  .nav-right svg { width: 17px; height: 17px; display: block; }
  .works-layout { max-width: 1240px; margin: 0 auto; padding: 88px 32px 120px; display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 64px; align-items: start; }
  .patron-sidebar { position: sticky; top: 32px; display: grid; gap: 14px; padding-top: 8px; }
  .patron-sidebar a { color: var(--muted); font-size: 0.7rem; letter-spacing: 0.12em; line-height: 1.4; text-transform: uppercase; }
  .patron-sidebar a:hover, .patron-sidebar a.active { color: #fff; }
  h1 { font-size: 2.75rem; font-weight: 500; line-height: 0.95; margin-bottom: 22px; }
  .intro { max-width: 620px; color: var(--muted); font-size: 1.08rem; line-height: 1.55; margin-bottom: 48px; }
  .works-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 18px; }
  .work-card { min-width: 0; }
  .work-card a { display: block; }
  .work-image { aspect-ratio: 1 / 1.12; display: grid; place-items: center; overflow: hidden; background: var(--panel); }
  .work-image img { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform 220ms ease; }
  .work-card a:hover img, .work-card a:focus-visible img { transform: scale(1.025); }
  .work-card h2 { font-size: 0.9rem; font-weight: 500; letter-spacing: 0.02em; margin-top: 12px; }
  .gallery-message { grid-column: 1 / -1; padding: 70px 24px; border: 1px solid var(--line); color: var(--muted); text-align: center; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
  footer { background: #000; color: #fff; padding: 44px 32px 24px; text-align: center; }
  .footer-bottom { max-width: 1160px; margin: 38px auto 0; padding: 22px 0 0 40px; border-top: 1px solid rgba(255,255,255,0.25); display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 14px 24px; font-size: 0.7rem; letter-spacing: 0.05em; position: relative; }
  .footer-bottom .made-with { color: var(--muted); margin-right: auto; }
  .made-with img { display: block; width: 88px; height: auto; }
  .footer-links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .subscribe-form { display: flex; max-width: 420px; margin: 0 auto; gap: 10px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .subscribe-form input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.16); border-radius: 1px; background: var(--panel); color: #fff; font: 0.85rem 'Jost', sans-serif; }
  .subscribe-form button { padding: 12px 20px; border: none; background: var(--panel); color: #fff; font: 0.72rem 'Jost', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
  .subscribe-form button:hover { background: #343434; }
  @media (max-width: 900px) {
    nav { position: relative; min-height: 95px; padding: 20px 24px; flex-wrap: wrap; row-gap: 14px; }
    .logo { flex: 1 1 180px; max-width: 180px; font-size: clamp(0.78rem, 3.8vw, 1.2rem); line-height: 0.96; }
    .nav-right { position: absolute; top: 20px; right: 24px; }
    .nav-links { order: 3; flex-basis: 100%; min-width: 0; width: 100%; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; }
    .nav-links li { min-width: 0; text-align: center; }
    .nav-links a { font-size: clamp(0.48rem, 2.5vw, 0.65rem); letter-spacing: 0.08em; white-space: nowrap; }
    .works-layout { display: block; padding: 64px 24px 90px; }
    .patron-sidebar { position: static; display: flex; flex-wrap: wrap; gap: 10px 18px; padding: 0; margin-bottom: 52px; }
  }
  @media (max-width: 700px) { .works-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; } }
  @media (max-width: 600px) {
    .footer-bottom { padding: 18px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 16px 12px; }
    .footer-bottom .subscribe-form { position: static; grid-column: 1 / -1; grid-row: 1; width: 100%; transform: none; }
    .footer-bottom .made-with { grid-column: 1; grid-row: 2; margin-right: 0; align-self: center; }
    .made-with img { width: 48px; }
    .footer-links { grid-column: 2; grid-row: 2; gap: 8px 12px; justify-content: flex-end; align-items: center; }
    h1 { font-size: 2.2rem; }
  }
</style>
</head>
<body>
  <nav>
    <div class="logo">JAKE YEN PO YEH</div>
    <ul class="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="artworks.html">ARTWORKS</a></li>
      <li><a href="patrons.html" class="active">PATRONS</a></li>
      <li><a href="inquire.html">INQUIRE</a></li>
      <li><a href="about.html">ABOUT</a></li>
    </ul>
    <div class="nav-right">
      <a href="https://instagram.com/jakeyeh_art" aria-label="Visit Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="0.6" fill="currentColor" stroke="none"/></svg></a>
    </div>
  </nav>

  <main class="works-layout">
    <aside class="patron-sidebar" aria-label="Patron pages">
      <a href="patrons.html">Patronage Instruction</a>
      <a class="active" href="patron-works.html">Completed Patron Works</a>
    </aside>
    <div>
      <h1>Completed Patron Works</h1>
      <div class="works-grid" id="works-grid">
        <p class="gallery-message">Loading completed works...</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-bottom">
      <div class="made-with"><img src="https://raw.githubusercontent.com/jakeyeh-art/Website/main/images/Stamp.png" alt="Jake Yeh stamp" onerror="this.hidden = true; this.nextElementSibling.hidden = false;"><span hidden>Built by Jake Yeh</span></div>
      <form class="subscribe-form" action="https://formspree.io/f/xjyvbdlr" method="POST">
        <input type="email" name="email" placeholder="Email Address" autocomplete="email" required>
        <button type="submit">Subscribe</button>
      </form>
      <div class="footer-links">
        <a href="artworks.html">Artworks</a>
        <a href="patrons.html">Patrons</a>
        <a href="inquire.html">Inquire</a>
        <a href="about.html">About</a>
        <a href="https://instagram.com/jakeyeh_art">Instagram</a>
      </div>
    </div>
  </footer>

  <script>
    const worksGrid = document.getElementById('works-grid');
    const imageExtensions = /\.(avif|gif|jpe?g|png|webp)$/i;
    const contentsUrl = 'https://api.github.com/repos/jakeyeh-art/Website/contents/images/patron-works?ref=main';

    function titleFromFilename(filename) {
      const normalizedName = filename.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim();
      const titleOverrides = { 'Fahad': 'Fahad', 'Lyla': 'Lyla Baby and Toys', 'River Trip': 'River Trip', 'Untitled': 'Untitled' };
      const baseTitle = normalizedName.replace(/\b\w/g, character => character.toUpperCase());
      return titleOverrides[baseTitle] || baseTitle;
    }

    function showMessage(message) {
      worksGrid.innerHTML = `<p class="gallery-message">${message}</p>`;
    }

    fetch(contentsUrl)
      .then(response => {
        if (!response.ok) throw new Error('Unable to load artwork folder');
        return response.json();
      })
      .then(files => {
        const works = files.filter(file => file.type === 'file' && imageExtensions.test(file.name)).sort((a, b) => a.name.localeCompare(b.name));
        if (!works.length) {
          showMessage('You can be the first patron. Completed works will appear here.');
          return;
        }
        worksGrid.innerHTML = works.map(file => `
          <article class="work-card">
            <a href="artwork-detail.html?folder=patron-works&image=${encodeURIComponent(file.name)}&title=${encodeURIComponent(titleFromFilename(file.name))}">
              <div class="work-image"><img src="https://raw.githubusercontent.com/jakeyeh-art/Website/main/images/patron-works/${encodeURIComponent(file.name)}" alt="${titleFromFilename(file.name)}" loading="lazy"></div>
              <h2>${titleFromFilename(file.name)}</h2>
            </a>
          </article>
        `).join('');
      })
      .catch(() => showMessage('You can be the first patron. Completed works will appear here.'));
  </script>
</body>
</html>
