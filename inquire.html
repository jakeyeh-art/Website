<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<title>INQUIRE | JAKE YEN PO YEH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --cream: #faf8f4; --ink: #2b2822; --olive: #7d7758; --line: #c9c2ae; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Jost', sans-serif; color: var(--ink); background: var(--cream); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 48px; border-bottom: 1px solid var(--line); }
  .logo { font-family: 'Bungee', sans-serif; font-size: 1.35rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .nav-links { display: flex; gap: 36px; list-style: none; }
  .nav-links a { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; padding-bottom: 4px; border-bottom: 1px solid transparent; }
  .nav-links a.active, .nav-links a:hover { border-bottom-color: var(--ink); }
  .nav-right { display: flex; align-items: center; }
  .nav-right svg { width: 17px; height: 17px; display: block; }
  .content { max-width: 760px; margin: 0 auto; padding: 88px 32px 120px; }
  .eyebrow { color: var(--olive); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 22px; }
  h1 { font-family: 'Jost', sans-serif; font-size: 5.5rem; font-weight: 500; line-height: 0.95; margin-bottom: 28px; }
  .intro { max-width: 590px; font-family: 'Jost', sans-serif; font-size: 1.35rem; line-height: 1.55; margin-bottom: 54px; }
  form { display: grid; gap: 24px; }
  label { display: grid; gap: 9px; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; }
  input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 1px; background: #fff; color: var(--ink); font: 1rem 'Jost', sans-serif; padding: 13px 14px; }
  textarea { min-height: 180px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--olive); outline-offset: 2px; }
  button { justify-self: start; border: 0; background: var(--olive); color: #fff; cursor: pointer; padding: 14px 22px; font: 0.72rem 'Jost', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; }
  button:hover { background: #5f5a42; }
  .form-note { color: #6b6656; font-size: 0.78rem; line-height: 1.5; }
  @media (max-width: 900px) { nav { padding: 20px 24px; flex-wrap: wrap; row-gap: 14px; } .nav-links { order: 3; flex-basis: 100%; justify-content: space-between; gap: 12px; } .nav-links a { font-size: 0.65rem; } .content { padding: 64px 24px 90px; } h1 { font-size: 3rem; } }
</style>
</head>
<body>
  <nav>
    <div class="logo">JAKE YEN PO YEH</div>
    <ul class="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="artworks.html">ARTWORKS</a></li>
      <li><a href="inquire.html" class="active">INQUIRE</a></li>
      <li><a href="about.html">ABOUT</a></li>
    </ul>
    <div class="nav-right">
      <a href="https://instagram.com/jakeyeh_art" aria-label="Visit Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="0.6" fill="currentColor" stroke="none"/></svg></a>
    </div>
  </nav>

  <main class="content">
    <div class="eyebrow">Start a conversation</div>
    <h1>Inquire</h1>
    <p class="intro">For questions about available work, commissions, or studio visits, leave a note below. I will get back to you as soon as I can.</p>
    <form action="https://formspree.io/f/xbgjrqeo" method="POST">
      <label for="name">Name<input id="name" name="name" type="text" autocomplete="name" required></label>
      <label for="email">Email<input id="email" name="email" type="email" autocomplete="email" required></label>
      <label for="note">Note<textarea id="note" name="message" required></textarea></label>
      <button type="submit">Send inquiry</button>
      <p class="form-note">Your message will be sent securely. I will respond by email.</p>
    </form>
  </main>
</body>
</html>
