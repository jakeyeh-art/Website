<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<title>SKETCHBOOKS | JAKE YEN PO YEH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --cream: #f7f1e8; --ink: #f5efe6; --olive: #9a9076; --olive-dark: #2d2722; --paper: #171310; --panel: #221d1a; --panel-soft: #2d2825; --line: transparent; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Jost', sans-serif; color: var(--ink); background: radial-gradient(circle at top, #3a322d 0%, #201c19 34%, #12100f 100%); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 48px; border-bottom: 1px solid rgba(245, 239, 230, 0.08); }
  .logo { font-family: 'Bungee', sans-serif; font-size: 1.35rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .nav-links { display: flex; gap: 36px; list-style: none; }
  .nav-links a { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; padding-bottom: 4px; border-bottom: 1px solid transparent; }
  .nav-links a.active, .nav-links a:hover { border-bottom-color: rgba(245, 239, 230, 0.7); }
  .nav-right svg { width: 17px; height: 17px; display: block; }
  .content { max-width: 900px; margin: 0 auto; padding: 64px 32px 90px; text-align: center; }
  .eyebrow { color: var(--olive); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 18px; }
  h1 { font-family: 'Jost', sans-serif; font-size: 3.5rem; font-weight: 500; margin-bottom: 34px; }
  .viewer { display: grid; gap: 22px; }
  .sketchbook-image { width: 100%; min-height: 320px; max-height: calc(100vh - 220px); display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--panel); border: none; box-shadow: none; overflow: hidden; }
  .sketchbook-image span { padding: 12px 16px; background: rgba(247, 241, 232, 0.08); color: var(--cream); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .sketchbook-image img { display: none; max-width: 100%; max-height: calc(100vh - 220px); width: auto; height: auto; object-fit: contain; object-position: center; }
  .controls { display: flex; justify-content: space-between; gap: 16px; }
  .controls button { min-width: 120px; border: none; background: rgba(255, 255, 255, 0.04); color: var(--ink); cursor: pointer; padding: 11px 16px; font: 0.72rem 'Jost', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
  .controls button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
  .controls button:disabled { opacity: 0.35; cursor: default; }
  .counter { color: rgba(245, 239, 230, 0.74); font-size: 0.75rem; align-self: center; }
  .artworks-link { position: fixed; right: 24px; bottom: 24px; z-index: 5; padding: 10px 14px; background: var(--olive-dark); color: #fff; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .artworks-link:hover { background: var(--olive); }
  footer { background: var(--olive); color: #f4f1e8; padding: 44px 32px 24px; text-align: center; }
  footer h2 { font-size: 2rem; font-weight: 500; letter-spacing: 0.04em; margin-bottom: 10px; }
  footer p.sub { color: #e5e1d2; font-size: 0.85rem; margin-bottom: 26px; }
  .subscribe-form { display: flex; max-width: 420px; margin: 0 auto; gap: 10px; }
  .subscribe-form input { flex: 1; min-width: 0; padding: 12px 14px; border: none; border-radius: 1px; font: 0.85rem 'Jost', sans-serif; }
  .subscribe-form button { padding: 12px 20px; border: none; background: var(--olive-dark); color: #fff; font: 0.72rem 'Jost', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
  .subscribe-form button:hover { background: #3c3829; }
  .footer-bottom { max-width: 1160px; margin: 38px auto 0; padding: 22px 0 0 40px; border-top: 1px solid rgba(244,241,232,0.25); display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 14px 24px; font-size: 0.7rem; letter-spacing: 0.05em; position: relative; }
  .footer-bottom .made-with { color: #cfcab8; margin-right: auto; }
  .made-with img { display: block; width: 88px; height: auto; }
  .footer-links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .footer-bottom .subscribe-form { position: absolute; top: 50%; left: 50%; margin: 0; transform: translate(-50%, -50%); }
  @media (max-width: 600px) { .footer-bottom { padding: 18px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 16px 12px; } .footer-bottom .subscribe-form { position: static; grid-column: 1 / -1; grid-row: 1; width: 100%; transform: none; } .footer-bottom .made-with { grid-column: 1; grid-row: 2; margin-right: 0; align-self: center; } .made-with img { width: 48px; } .footer-links { grid-column: 2; grid-row: 2; gap: 8px 12px; justify-content: flex-end; align-items: center; } }
  @media (max-width: 768px) { .content { max-width: none; padding: 48px 20px 70px; } .viewer { width: 100%; justify-items: stretch; } .gallery-grid { width: 100%; height: auto; min-height: 0; overflow: visible; padding-right: 0; } .gallery-grid.mobile-view { display: block; } .gallery-item { position: relative; left: auto; top: auto !important; width: 100%; max-width: none; height: min(72vh, 620px); aspect-ratio: auto; margin-bottom: 18px; } .gallery-item img { object-fit: contain; } .gallery-item:hover img, .gallery-item:focus-visible img { transform: none; } .gallery-controls { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 10px; } .gallery-controls button { min-width: 120px; background: transparent; border: none; color: var(--ink); cursor: pointer; padding: 0; font: 0.72rem 'Jost', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; } .gallery-controls button:hover:not(:disabled) { background: transparent; } .gallery-controls button:disabled { opacity: 0.35; cursor: default; } .gallery-controls .counter { color: rgba(245, 239, 230, 0.74); font-size: 0.75rem; } }
</style>
</head>
<body>
  <nav>
    <div class="logo">JAKE YEN PO YEH</div>
    <ul class="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="artworks.html">ARTWORKS</a></li>
      <li><a href="inquire.html">INQUIRE</a></li>
      <li><a href="about.html">ABOUT</a></li>
    </ul>
    <div class="nav-right">
      <a href="https://instagram.com/jakeyeh_art" aria-label="Visit Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="0.6" fill="currentColor" stroke="none"/></svg></a>
    </div>
  </nav>

  <main class="content">
    <div class="viewer">
      <div class="sketchbook-image">
        <img id="sketchbook-photo" alt="Sketchbook page">
        <span id="photo-placeholder">Loading sketchbook photos...</span>
      </div>
      <div class="controls">
        <button id="previous" type="button">Previous</button>
        <span class="counter" id="counter">1 / 1</span>
        <button id="next" type="button">Next</button>
      </div>
    </div>
  </main>

  <a class="artworks-link" href="artworks.html">ARTWORKS</a>

  <footer>
    <div class="footer-bottom">
      <div class="made-with"><img src="https://raw.githubusercontent.com/jakeyeh-art/Website/main/images/Stamp.png" alt="Jake Yeh stamp" onerror="this.hidden = true; this.nextElementSibling.hidden = false;"><span hidden>Built by Jake Yeh</span></div>
      <form class="subscribe-form" action="https://formspree.io/f/xjyvbdlr" method="POST">
        <input type="email" name="email" placeholder="Email Address" autocomplete="email" required>
        <button type="submit">Subscribe</button>
      </form>
      <div class="footer-links">
        <a href="artworks.html">Artworks</a>
        <a href="about.html">About</a>
        <a href="inquire.html">Inquire</a>
        <a href="https://instagram.com/jakeyeh_art">Instagram</a>
      </div>
    </div>
  </footer>

  <script>
    const contentsUrl = 'https://api.github.com/repos/jakeyeh-art/Website/contents/images/sketches?ref=main';
    const imageExtensions = /\.(avif|gif|jpe?g|png|webp)$/i;
    let photos = [];
    let currentPhoto = 0;
    const image = document.getElementById('sketchbook-photo');
    const placeholder = document.getElementById('photo-placeholder');
    const counter = document.getElementById('counter');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');

    function showPhoto() {
      if (!photos.length) {
        image.style.display = 'none';
        placeholder.textContent = 'Add sketchbook photos to images/sketches';
        placeholder.style.display = 'block';
        counter.textContent = '0 / 0';
        previous.disabled = true;
        next.disabled = true;
        return;
      }

      image.src = photos[currentPhoto];
      image.alt = `Sketchbook page ${currentPhoto + 1}`;
      image.onload = () => { image.style.display = 'block'; placeholder.style.display = 'none'; };
      image.onerror = () => { image.style.display = 'none'; placeholder.style.display = 'block'; };
      counter.textContent = `${currentPhoto + 1} / ${photos.length}`;
      previous.disabled = currentPhoto === 0;
      next.disabled = currentPhoto === photos.length - 1;
    }

    previous.addEventListener('click', () => {
      if (currentPhoto > 0) {
        currentPhoto -= 1;
        showPhoto();
      }
    });

    next.addEventListener('click', () => {
      if (currentPhoto < photos.length - 1) {
        currentPhoto += 1;
        showPhoto();
      }
    });

    fetch(contentsUrl)
      .then(response => {
        if (!response.ok) throw new Error('Unable to load sketchbook folder');
        return response.json();
      })
      .then(files => {
        photos = files.filter(file => file.type === 'file' && imageExtensions.test(file.name))
          .sort((a, b) => a.name.localeCompare(b.name))
          .map(file => file.download_url);
        showPhoto();
      })
      .catch(() => {
        placeholder.textContent = 'Sketchbook photos are temporarily unavailable';
        placeholder.style.display = 'block';
        counter.textContent = '0 / 0';
        previous.disabled = true;
        next.disabled = true;
      });
  </script>
</body>
</html>
