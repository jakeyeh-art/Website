<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/Stamp.png?v=2" type="image/png">
<title>SKETCHBOOKS | JAKE YEN PO YEH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --cream: #000; --ink: #fff; --olive: #c7c7c7; --olive-dark: #202020; --paper: #000; --panel: #202020; --panel-soft: #2a2a2a; --line: rgba(255, 255, 255, 0.2); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Jost', sans-serif; color: var(--ink); background: #000; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 28px 48px; border-bottom: 1px solid rgba(245, 239, 230, 0.08); }
  .logo { font-family: 'Bungee', sans-serif; font-size: 1.35rem; line-height: 0.94; letter-spacing: 0.04em; text-transform: uppercase; max-width: 220px; white-space: normal; word-break: break-word; }
  .nav-links { display: flex; gap: 36px; list-style: none; }
  .nav-links a { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; padding-bottom: 4px; border-bottom: 1px solid transparent; }
  .nav-links a.active, .nav-links a:hover { border-bottom-color: rgba(245, 239, 230, 0.7); }
  .nav-right { display: flex; align-items: center; gap: 26px; }
  .nav-right svg { width: 17px; height: 17px; display: block; }
  .page { max-width: 1240px; margin: 0 auto; padding: 46px 40px 100px; }
  .gallery-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .gallery-hint { color: rgba(255, 255, 255, 0.68); font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; }
  .artwork-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .painting-card { min-width: 0; }
  .painting-card button { display: block; width: 100%; padding: 0; border: 0; background: var(--panel); color: inherit; cursor: zoom-in; }
  .painting-img { aspect-ratio: 1 / 1; width: 100%; display: flex; align-items: center; justify-content: center; background: var(--panel); overflow: hidden; }
  .painting-img img { width: 100%; height: 100%; object-fit: contain; display: block; transition: transform 220ms ease; }
  .painting-card button:hover img, .painting-card button:focus-visible img { transform: scale(1.04); }
  .gallery-message { grid-column: 1 / -1; padding: 70px 24px; border: 1px solid var(--line); color: rgba(255, 255, 255, 0.68); text-align: center; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .lightbox[hidden] { display: none; }
  .lightbox { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 32px; background: rgba(0, 0, 0, 0.9); overflow: auto; }
  .lightbox-image { max-width: min(92vw, 1100px); max-height: calc(100dvh - 96px); width: auto; height: auto; object-fit: contain; display: block; }
  .lightbox-close { position: absolute; top: 20px; right: 24px; width: 42px; height: 42px; border: 1px solid rgba(255, 255, 255, 0.45); background: #202020; color: #fff; cursor: pointer; font: 1.5rem/1 'Jost', sans-serif; }
  .lightbox-close:hover { background: #343434; }
  .artworks-link { position: fixed; right: 24px; bottom: 24px; z-index: 5; padding: 10px 14px; background: #202020; color: #fff; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; }
  .artworks-link:hover { background: #343434; }
  footer { background: #000; color: #fff; padding: 44px 32px 24px; text-align: center; }
  footer h2 { font-size: 2rem; font-weight: 500; letter-spacing: 0.04em; margin-bottom: 10px; }
  footer p.sub { color: rgba(255, 255, 255, 0.72); font-size: 0.85rem; margin-bottom: 26px; }
  .subscribe-form { display: flex; max-width: 420px; margin: 0 auto; gap: 10px; }
  .subscribe-form input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 1px; background: #202020; color: #fff; font: 0.85rem 'Jost', sans-serif; }
  .subscribe-form button { padding: 12px 20px; border: none; background: #202020; color: #fff; font: 0.72rem 'Jost', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
  .subscribe-form button:hover { background: #343434; }
  .footer-bottom { max-width: 1160px; margin: 38px auto 0; padding: 22px 0 0 40px; border-top: 1px solid rgba(244,241,232,0.25); display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 14px 24px; font-size: 0.7rem; letter-spacing: 0.05em; position: relative; }
  .footer-bottom .made-with { color: #cfcab8; margin-right: auto; }
  .made-with img { display: block; width: 88px; height: auto; }
  .footer-links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .footer-bottom .subscribe-form { position: absolute; top: 50%; left: 50%; margin: 0; transform: translate(-50%, -50%); }
  @media (max-width: 600px) { .footer-bottom { padding: 18px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 16px 12px; } .footer-bottom .subscribe-form { position: static; grid-column: 1 / -1; grid-row: 1; width: 100%; transform: none; } .footer-bottom .made-with { grid-column: 1; grid-row: 2; margin-right: 0; align-self: center; } .made-with img { width: 48px; } .footer-links { grid-column: 2; grid-row: 2; gap: 8px 12px; justify-content: flex-end; align-items: center; } }
  @media (max-width: 800px) { nav { flex-wrap: wrap; row-gap: 14px; } .logo { flex: 1 1 180px; max-width: 180px; font-size: clamp(0.78rem, 3.8vw, 1.2rem); line-height: 0.96; } .page { padding: 30px 20px 70px; } .artwork-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .gallery-hint { font-size: 0.58rem; letter-spacing: 0.14em; } }
  @media (max-width: 480px) { .lightbox { padding: 56px 12px 18px; } .lightbox-image { max-width: calc(100vw - 24px); max-height: calc(100dvh - 86px); } .lightbox-close { top: 12px; right: 12px; } }
</style>
</head>
<body>
  <nav>
    <div class="logo">JAKE YEN PO YEH</div>
    <ul class="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="artworks.html">ARTWORKS</a></li>
      <li><a href="patrons.html">PATRONS</a></li>
      <li><a href="inquire.html">INQUIRE</a></li>
      <li><a href="about.html">ABOUT</a></li>
    </ul>
    <div class="nav-right">
      <a href="https://instagram.com/jakeyeh_art" aria-label="Visit Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="0.6" fill="currentColor" stroke="none"/></svg></a>
    </div>
  </nav>

  <main class="page">
    <div class="artwork-grid" id="sketchbook-grid">
      <p class="gallery-message">Loading sketchbook photos...</p>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Expanded sketchbook page" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close expanded image">&times;</button>
    <img class="lightbox-image" id="lightbox-image" alt="">
  </div>

  <a class="artworks-link" href="artworks.html">ARTWORKS</a>

  <footer>
    <div class="footer-bottom">
      <div class="made-with"><img src="https://raw.githubusercontent.com/jakeyeh-art/Website/main/images/Stamp.png" alt="Jake Yeh stamp" onerror="this.hidden = true; this.nextElementSibling.hidden = false;"><span hidden>Built by Jake Yeh</span></div>
      <form class="subscribe-form" action="https://formspree.io/f/xjyvbdlr" method="POST">
        <input type="email" name="email" placeholder="Email Address" autocomplete="email" required>
        <button type="submit">Subscribe</button>
      </form>
      <div class="footer-links">
        <a href="artworks.html">Artworks</a>
        <a href="about.html">About</a>
        <a href="inquire.html">Inquire</a>
        <a href="patrons.html">Patrons</a>
        <a href="https://instagram.com/jakeyeh_art">Instagram</a>
      </div>
    </div>
  </footer>

  <script>
    const sketchbookGrid = document.getElementById('sketchbook-grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxClose = document.getElementById('lightbox-close');
    const imageExtensions = /\.(avif|gif|jpe?g|png|webp)$/i;
    const contentsUrl = 'https://api.github.com/repos/jakeyeh-art/Website/contents/images/sketches?ref=main';

    function titleFromFilename(filename) {
      return filename
        .replace(/\.[^.]+$/, '')
        .replace(/[-_]+/g, ' ')
        .replace(/\b\w/g, character => character.toUpperCase());
    }

    function showMessage(message) {
      sketchbookGrid.innerHTML = `<p class="gallery-message">${message}</p>`;
    }

    fetch(contentsUrl)
      .then(response => {
        if (!response.ok) throw new Error('Unable to load sketchbook folder');
        return response.json();
      })
      .then(files => {
        const sketches = files
          .filter(file => file.type === 'file' && imageExtensions.test(file.name))
          .sort((a, b) => a.name.localeCompare(b.name));
        if (!sketches.length) {
          showMessage('Add sketchbook photos to images/sketches');
          return;
        }
        sketchbookGrid.innerHTML = sketches.map((file, index) => `
          <div class="painting-card">
            <button type="button" class="painting-button" data-image="${file.download_url}" data-alt="Sketchbook page ${index + 1}" aria-label="Open sketchbook page ${index + 1}">
              <div class="painting-img"><img src="${file.download_url}" alt="${titleFromFilename(file.name)}" loading="lazy"></div>
            </button>
          </div>
        `).join('');
        sketchbookGrid.querySelectorAll('.painting-button').forEach(button => {
          button.addEventListener('click', () => {
            lightboxImage.src = button.dataset.image;
            lightboxImage.alt = button.dataset.alt;
            lightbox.hidden = false;
            lightboxClose.focus();
          });
        });
      })
      .catch(() => showMessage('Sketchbook photos are temporarily unavailable'));

    function closeLightbox() {
      lightbox.hidden = true;
      lightboxImage.removeAttribute('src');
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
    });
  </script>
</body>
</html>
