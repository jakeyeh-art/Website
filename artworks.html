<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/Stamp.png?v=2" type="image/png">
<title>ARTWORKS | JAKE YEN PO YEH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #000;
    --ink: #fff;
    --olive: #c7c7c7;
    --olive-dark: #202020;
    --line: rgba(255, 255, 255, 0.3);
    --sold: #b6512f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    color: var(--ink);
    background: var(--cream);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  /* ---------- NAV ---------- */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px;
    border-bottom: 1px solid var(--line);
    background: var(--cream);
  }

  .logo {
    font-family: 'Bungee', sans-serif;
    font-size: 1.35rem;
    line-height: 0.94;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    max-width: 220px;
    white-space: normal;
    word-break: break-word;
  }

  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding-bottom: 4px;
    border-bottom: 1px solid transparent;
  }

  .nav-links a.active,
  .nav-links a:hover { border-bottom-color: var(--ink); }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 26px;
  }

  .nav-right svg { width: 17px; height: 17px; display: block; }

  /* ---------- LAYOUT ---------- */
  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 46px 40px 100px;
  }

  .gallery-toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
  }

  .gallery-hint {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: rgba(255, 255, 255, 0.72);
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding-right: 2px;
  }

  .gallery-hint::before {
    content: "";
    width: 24px;
    height: 1px;
    background: rgba(255, 255, 255, 0.35);
    position: relative;
  }

  .gallery-hint::after {
    content: "";
    width: 7px;
    height: 7px;
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    border-right: 1px solid rgba(255, 255, 255, 0.45);
    transform: rotate(45deg);
    display: block;
    animation: drift 1.8s ease-in-out infinite alternate;
  }

  @keyframes drift {
    0% { transform: translateX(-2px) rotate(45deg); opacity: 0.45; }
    100% { transform: translateX(4px) rotate(45deg); opacity: 1; }
  }

  .artwork-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }

  .painting-card {
    min-width: 0;
  }

  .painting-button {
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    cursor: zoom-in;
  }

  .painting-img {
    aspect-ratio: 1 / 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    overflow: hidden;
  }

  .painting-img img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transition: transform 220ms ease;
  }

  .painting-button:hover img, .painting-button:focus-visible img { transform: scale(1.04); }

  .lightbox[hidden] { display: none; }
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 48px;
    background: rgba(0, 0, 0, 0.94);
  }
  .lightbox-content {
    width: min(1180px, 100%);
    max-height: calc(100dvh - 96px);
    display: grid;
    grid-template-columns: minmax(0, 1fr) 190px;
    align-items: center;
    gap: 32px;
  }
  .lightbox-image {
    max-width: 100%;
    max-height: calc(100dvh - 110px);
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    justify-self: center;
  }
  .lightbox-info { color: rgba(255, 255, 255, 0.72); }
  .lightbox-info h2 { font-size: 0.82rem; font-weight: 400; line-height: 1.45; margin-bottom: 8px; }
  .lightbox-info p { font-size: 0.72rem; color: rgba(255, 255, 255, 0.52); }
  .lightbox-close, .lightbox-nav {
    position: absolute;
    z-index: 1;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255, 255, 255, 0.35);
    background: #202020;
    color: #fff;
    cursor: pointer;
    font: 1.5rem/1 'Jost', sans-serif;
  }
  .lightbox-close { top: 20px; right: 24px; }
  .lightbox-prev { left: 20px; top: 50%; transform: translateY(-50%); }
  .lightbox-next { right: 20px; top: 50%; transform: translateY(-50%); }
  .lightbox-close:hover, .lightbox-nav:hover { background: #343434; }

  @media (max-width: 800px) {
    .artwork-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .lightbox { padding: 56px 24px 24px; }
    .lightbox-content { grid-template-columns: 1fr; gap: 14px; justify-items: center; }
    .lightbox-image { max-height: calc(100dvh - 170px); }
    .lightbox-info { width: min(100%, 600px); }
    .lightbox-prev { left: 10px; }
    .lightbox-next { right: 10px; }
  }

  @media (max-width: 480px) {
    .lightbox { padding: 56px 12px 18px; }
    .lightbox-image { max-width: calc(100vw - 24px); max-height: calc(100dvh - 150px); }
    .lightbox-close { top: 12px; right: 12px; }
  }

  .gallery-message {
    width: 100%;
    padding: 70px 24px;
    border: 1px solid var(--line);
    color: rgba(255, 255, 255, 0.68);
    text-align: center;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .sketchbook-link {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 5;
    padding: 10px 14px;
    background: var(--olive-dark);
    color: #fff;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .sketchbook-link:hover { background: var(--olive); }
  footer { background: #000; color: #fff; padding: 44px 32px 24px; text-align: center; }
  footer h2 { font-size: 2rem; font-weight: 500; letter-spacing: 0.04em; margin-bottom: 10px; }
  footer p.sub { color: rgba(255, 255, 255, 0.72); font-size: 0.85rem; margin-bottom: 26px; }
  .subscribe-form { display: flex; max-width: 420px; margin: 0 auto; gap: 10px; }
  .subscribe-form input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 1px; background: #202020; color: #fff; font: 0.85rem 'Jost', sans-serif; }
  .subscribe-form button { padding: 12px 20px; border: none; background: #202020; color: #fff; font: 0.72rem 'Jost', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
  .subscribe-form button:hover { background: #343434; }
  .footer-bottom { max-width: 1160px; margin: 38px auto 0; padding: 22px 0 0 40px; border-top: 1px solid rgba(244,241,232,0.25); display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 14px 24px; font-size: 0.7rem; letter-spacing: 0.05em; position: relative; }
  .footer-bottom .made-with { color: #cfcab8; margin-right: auto; }
  .made-with img { display: block; width: 88px; height: auto; }
  .footer-links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .footer-bottom .subscribe-form { position: absolute; top: 50%; left: 50%; margin: 0; transform: translate(-50%, -50%); }

  @media (max-width: 600px) {
    .footer-bottom { padding: 18px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 16px 12px; }
    .footer-bottom .subscribe-form { position: static; grid-column: 1 / -1; grid-row: 1; width: 100%; transform: none; }
    .footer-bottom .made-with { grid-column: 1; grid-row: 2; margin-right: 0; align-self: center; }
    .made-with img { width: 48px; }
    .footer-links { grid-column: 2; grid-row: 2; gap: 8px 12px; justify-content: flex-end; align-items: center; }
  }

  @media (max-width: 800px) {
    .page { padding: 30px 24px 70px; }
    .gallery-hint { font-size: 0.58rem; letter-spacing: 0.14em; }
    nav { position: relative; width: 100%; min-height: 95px; padding: 20px 24px; flex-wrap: wrap; row-gap: 14px; }
    .logo {
      flex: 1 1 180px;
      max-width: 180px;
      font-size: clamp(0.78rem, 3.8vw, 1.2rem);
      line-height: 0.96;
    }
    .nav-right { position: absolute; top: 20px; right: 24px; }
    .nav-links { order: 3; flex-basis: 100%; min-width: 0; width: 100%; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; }
    .nav-links li { min-width: 0; text-align: center; }
    .nav-links a { font-size: clamp(0.48rem, 2.5vw, 0.65rem); letter-spacing: 0.08em; white-space: nowrap; }
  }

</style>
</head>
<body>

  <nav>
    <div class="logo">JAKE YEN PO YEH</div>
    <ul class="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="artworks.html" class="active">ARTWORKS</a></li>
      <li><a href="patrons.html">PATRONS</a></li>
      <li><a href="inquire.html">INQUIRE</a></li>
      <li><a href="about.html">ABOUT</a></li>
    </ul>
    <div class="nav-right">
      <a href="https://instagram.com/jakeyeh_art" aria-label="Visit Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="0.6" fill="currentColor" stroke="none"/></svg></a>
    </div>
  </nav>

  <main class="page">
    <div class="gallery-toolbar" aria-label="Artwork gallery navigation">
      <div class="gallery-hint">More works</div>
    </div>
    <div class="artwork-grid" id="artwork-grid">
      <p class="gallery-message">Loading artworks...</p>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Expanded artwork" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close expanded image">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="Previous artwork">&lsaquo;</button>
    <div class="lightbox-content">
      <img class="lightbox-image" id="lightbox-image" alt="">
      <div class="lightbox-info" aria-live="polite">
        <h2 id="lightbox-title"></h2>
        <p id="lightbox-price"></p>
      </div>
    </div>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="Next artwork">&rsaquo;</button>
  </div>

  <a class="sketchbook-link" href="sketchbooks.html">Sketchbooks</a>

  <footer>
    <div class="footer-bottom">
      <div class="made-with"><img src="https://raw.githubusercontent.com/jakeyeh-art/Website/main/images/Stamp.png" alt="Jake Yeh stamp" onerror="this.hidden = true; this.nextElementSibling.hidden = false;"><span hidden>Built by Jake Yeh</span></div>
      <form class="subscribe-form" action="https://formspree.io/f/xjyvbdlr" method="POST">
        <input type="email" name="email" placeholder="Email Address" autocomplete="email" required>
        <button type="submit">Subscribe</button>
      </form>
      <div class="footer-links">
        <a href="artworks.html">Artworks</a>
        <a href="patrons.html">Patrons</a>
        <a href="inquire.html">Inquire</a>
        <a href="about.html">About</a>
        <a href="https://instagram.com/jakeyeh_art">Instagram</a>
      </div>
    </div>
  </footer>

  <script>
    const artworkGrid = document.getElementById('artwork-grid');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightbox-image');
    const lightboxTitle = document.getElementById('lightbox-title');
    const lightboxPrice = document.getElementById('lightbox-price');
    const lightboxClose = document.getElementById('lightbox-close');
    const artworkPrices = {
      'fahad': '$5,000.00',
      'lyla baby and toys': '$5,000.00',
      'river trip': '$5,000.00',
      'untitled': '$5,000.00',
      'icing on the cake': '$5,000.00',
      'benson': 'Private collection',
      'woman on the rock, river study': '$450.00',
      'as we grow old': '$1,200.00',
      'anderson park, late summer': '$320.00',
      'backyard, morning light': '$280.00',
      'study of a pear and knife': '$190.00',
      'old barn, west orange': '$400.00',
      'garden path in late bloom': '$310.00',
      'rooftops at dusk': '$380.00'
    };
    const imageExtensions = /\.(avif|gif|jpe?g|png|webp)$/i;
    const contentsUrl = 'https://api.github.com/repos/jakeyeh-art/Website/contents/images/artworks?ref=main';
    let artworks = [];
    let activeArtworkIndex = 0;

    function titleFromFilename(filename) {
      const normalizedName = filename.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim();
      const titleOverrides = {
        'Fahad': 'Fahad',
        'Lyla': 'Lyla Baby and Toys',
        'River Trip': 'River Trip',
        'Untitled': 'Untitled'
      };
      const baseTitle = normalizedName.replace(/\b\w/g, character => character.toUpperCase());
      return titleOverrides[baseTitle] || baseTitle;
    }

    function showMessage(message) {
      artworkGrid.innerHTML = `<p class="gallery-message">${message}</p>`;
    }

    function showArtwork(index) {
      activeArtworkIndex = (index + artworks.length) % artworks.length;
      const artwork = artworks[activeArtworkIndex];
      lightboxImage.src = artwork.image;
      lightboxImage.alt = artwork.title;
      lightboxTitle.textContent = artwork.title;
      lightboxPrice.textContent = artwork.price;
    }

    function closeLightbox() {
      lightbox.hidden = true;
      lightboxImage.removeAttribute('src');
    }

    fetch(contentsUrl)
      .then(response => {
        if (!response.ok) throw new Error('Unable to load artwork folder');
        return response.json();
      })
      .then(files => {
        const artworkOrder = [
          'Icing On The Cake.jpeg'
        ];
        artworks = files
          .filter(file => file.type === 'file' && imageExtensions.test(file.name))
          .sort((a, b) => {
            const indexA = artworkOrder.indexOf(a.name);
            const indexB = artworkOrder.indexOf(b.name);
            if (indexA === -1 && indexB === -1) return a.name.localeCompare(b.name);
            if (indexA === -1) return 1;
            if (indexB === -1) return -1;
            return indexA - indexB;
          });
        if (!artworks.length) {
          showMessage('Add artwork photos to images/artworks');
          return;
        }
        artworks = artworks.map(file => {
          const title = titleFromFilename(file.name);
          return {
            image: file.download_url,
            title,
            price: artworkPrices[title.toLowerCase()] || 'Price on request'
          };
        });
        artworkGrid.innerHTML = artworks.map((artwork, index) => `
          <div class="painting-card">
            <button type="button" class="painting-button" data-index="${index}" aria-label="Open ${artwork.title}">
              <div class="painting-img"><img src="${artwork.image}" alt="${artwork.title}" loading="lazy"></div>
            </button>
          </div>
        `).join('');
        artworkGrid.querySelectorAll('.painting-button').forEach(button => {
          button.addEventListener('click', () => {
            showArtwork(Number(button.dataset.index));
            lightbox.hidden = false;
            lightboxClose.focus();
          });
        });
      })
      .catch(() => showMessage('Artworks are temporarily unavailable'));

    document.getElementById('lightbox-prev').addEventListener('click', () => showArtwork(activeArtworkIndex - 1));
    document.getElementById('lightbox-next').addEventListener('click', () => showArtwork(activeArtworkIndex + 1));
    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', event => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', event => {
      if (lightbox.hidden) return;
      if (event.key === 'Escape') closeLightbox();
      if (event.key === 'ArrowLeft') showArtwork(activeArtworkIndex - 1);
      if (event.key === 'ArrowRight') showArtwork(activeArtworkIndex + 1);
    });
  </script>

</body>
</html>
