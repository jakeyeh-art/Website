<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<title>ARTWORKS | JAKE YEN PO YEH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf8f4;
    --ink: #2b2822;
    --olive: #7d7758;
    --olive-dark: #4f4a37;
    --line: #c9c2ae;
    --sold: #b6512f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    color: var(--ink);
    background: var(--cream);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; text-decoration: none; }

  /* ---------- NAV ---------- */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px;
    border-bottom: 1px solid var(--line);
    background: var(--cream);
  }

  .logo {
    font-family: 'Bungee', sans-serif;
    font-size: 1.35rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 36px;
    list-style: none;
  }

  .nav-links a {
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding-bottom: 4px;
    border-bottom: 1px solid transparent;
  }

  .nav-links a.active,
  .nav-links a:hover { border-bottom-color: var(--ink); }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 26px;
  }

  .nav-right svg { width: 17px; height: 17px; display: block; }

  /* ---------- LAYOUT ---------- */
  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 46px 40px 100px;
  }

  .artwork-grid {
    display: flex;
    gap: 36px;
    overflow-x: auto;
    padding: 12px 0 26px;
    scroll-snap-type: x mandatory;
    scrollbar-color: var(--olive) transparent;
  }

  .painting-card {
    flex: 0 0 100%;
    scroll-snap-align: start;
    text-align: left;
  }

  .artwork-link { display: block; }
  .artwork-link:hover .painting-img { outline: 2px solid var(--olive); outline-offset: 4px; }

  .painting-img {
    height: min(70vh, 720px);
    width: 100%;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    margin-bottom: 14px;
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: rgba(0,0,0,0.35);
  }

  .painting-img img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .painting-img span { padding: 0 16px; text-align: center; }

  .g1 { background: linear-gradient(160deg, #b9c79a, #e8e6c9 60%, #f4efdc); }
  .g2 { background: linear-gradient(150deg, #8fa5b8, #d8e0d8 55%, #f0ede0); }
  .g3 { background: linear-gradient(160deg, #d8c27a, #e9d9a3 60%, #f5ecd0); }
  .g4 { background: linear-gradient(150deg, #c9b48a, #e6d7b8 55%, #f6efe0); }
  .g5 { background: linear-gradient(160deg, #d1b45f, #ecd99a 60%, #f7edcf); }
  .g6 { background: linear-gradient(150deg, #b79a6a, #dcc79c 55%, #f4ecdb); }
  .g7 { background: linear-gradient(160deg, #a9b98d, #d9ddc0 60%, #f2f0e4); }
  .g8 { background: linear-gradient(150deg, #6b6450, #97907a 55%, #d6d1bf); }

  .sold-tag {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--sold);
    color: #fff;
    font-size: 0.58rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 4px 9px;
  }

  .painting-card h3 {
    font-family: 'Jost', sans-serif;
    font-weight: 500;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .painting-card .price {
    font-size: 0.8rem;
    color: #6b6656;
  }

  .gallery-message {
    width: 100%;
    padding: 70px 24px;
    border: 1px solid var(--line);
    color: #6b6656;
    text-align: center;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .sketchbook-link {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 5;
    padding: 10px 14px;
    background: var(--olive-dark);
    color: #fff;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .sketchbook-link:hover { background: var(--olive); }
  footer { background: var(--olive); color: #f4f1e8; padding: 44px 32px 24px; text-align: center; }
  footer h2 { font-size: 2rem; font-weight: 500; letter-spacing: 0.04em; margin-bottom: 10px; }
  footer p.sub { color: #e5e1d2; font-size: 0.85rem; margin-bottom: 26px; }
  .subscribe-form { display: flex; max-width: 420px; margin: 0 auto; gap: 10px; }
  .subscribe-form input { flex: 1; min-width: 0; padding: 12px 14px; border: none; border-radius: 1px; font: 0.85rem 'Jost', sans-serif; }
  .subscribe-form button { padding: 12px 20px; border: none; background: var(--olive-dark); color: #fff; font: 0.72rem 'Jost', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; }
  .subscribe-form button:hover { background: #3c3829; }
  .footer-bottom { max-width: 1160px; margin: 38px auto 0; padding: 22px 0 0 40px; border-top: 1px solid rgba(244,241,232,0.25); display: flex; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 14px 24px; font-size: 0.7rem; letter-spacing: 0.05em; position: relative; }
  .footer-bottom .made-with { color: #cfcab8; margin-right: auto; }
  .made-with img { display: block; width: 88px; height: auto; }
  .footer-links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .footer-bottom .subscribe-form { position: absolute; top: 50%; left: 50%; margin: 0; transform: translate(-50%, -50%); }

  @media (max-width: 800px) {
    .page { padding: 30px 24px 70px; }
    .artwork-grid { gap: 20px; }
    .painting-card { flex-basis: 100%; }
    nav { flex-wrap: wrap; row-gap: 14px; }
    .nav-links { order: 3; flex-basis: 100%; justify-content: space-between; gap: 12px; }
    .nav-links a { font-size: 0.65rem; }
  }

  @media (max-width: 480px) {
    .painting-card { flex-basis: 100%; }
    .painting-img { height: min(62vh, 480px); }
  }
</style>
</head>
<body>

  <nav>
    <div class="logo">JAKE YEN PO YEH</div>
    <ul class="nav-links">
      <li><a href="index.html">HOME</a></li>
      <li><a href="artworks.html" class="active">ARTWORKS</a></li>
      <li><a href="inquire.html">INQUIRE</a></li>
      <li><a href="about.html">ABOUT</a></li>
    </ul>
    <div class="nav-right">
      <a href="https://instagram.com/jakeyeh_art" aria-label="Visit Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="0.6" fill="currentColor" stroke="none"/></svg></a>
    </div>
  </nav>

  <main class="page">
    <div class="artwork-grid" id="artwork-grid">
      <p class="gallery-message">Loading artworks...</p>
    </div>
  </main>

  <a class="sketchbook-link" href="sketchbooks.html">Sketchbooks</a>

  <footer>
    <div class="footer-bottom">
      <div class="made-with"><img src="https://raw.githubusercontent.com/jakeyeh-art/Website/main/images/Stamp.png" alt="Jake Yeh stamp" onerror="this.hidden = true; this.nextElementSibling.hidden = false;"><span hidden>Built by Jake Yeh</span></div>
      <form class="subscribe-form" action="https://formspree.io/f/xjyvbdlr" method="POST">
        <input type="email" name="email" placeholder="Email Address" autocomplete="email" required>
        <button type="submit">Subscribe</button>
      </form>
      <div class="footer-links">
        <a href="artworks.html">Artworks</a>
        <a href="about.html">About</a>
        <a href="inquire.html">Inquire</a>
        <a href="https://instagram.com/jakeyeh_art">Instagram</a>
      </div>
    </div>
  </footer>

  <script>
    const artworkGrid = document.getElementById('artwork-grid');
    const imageExtensions = /\.(avif|gif|jpe?g|png|webp)$/i;
    const contentsUrl = 'https://api.github.com/repos/jakeyeh-art/Website/contents/images/artworks?ref=main';

    function titleFromFilename(filename) {
      return filename.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').replace(/\b\w/g, character => character.toUpperCase());
    }

    function showMessage(message) {
      artworkGrid.innerHTML = `<p class="gallery-message">${message}</p>`;
    }

    fetch(contentsUrl)
      .then(response => {
        if (!response.ok) throw new Error('Unable to load artwork folder');
        return response.json();
      })
      .then(files => {
        const artworks = files.filter(file => file.type === 'file' && imageExtensions.test(file.name)).sort((a, b) => a.name.localeCompare(b.name));
        if (!artworks.length) {
          showMessage('Add artwork photos to images/artworks');
          return;
        }
        artworkGrid.innerHTML = artworks.map(file => `
          <div class="painting-card">
            <a class="artwork-link" href="artwork-detail.html?image=${encodeURIComponent(file.download_url)}&title=${encodeURIComponent(titleFromFilename(file.name))}">
              <div class="painting-img"><img src="${file.download_url}" alt="${titleFromFilename(file.name)}" loading="lazy"></div>
              <h3>${titleFromFilename(file.name)}</h3>
            </a>
          </div>
        `).join('');
      })
      .catch(() => showMessage('Artworks are temporarily unavailable'));
  </script>

</body>
</html>
